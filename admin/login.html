<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Staff Login – Hanaqaad College</title>

  <!-- Favicon & App Icons -->
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="../favicon-16x16.png" />
  <link rel="icon" type="image/png" href="../favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png" />
  <link rel="shortcut icon" href="../favicon.ico" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet" />

  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

  <style>
    :root {
      --blue-50: #eff6ff;
      --blue-100: #dbeafe;
      --blue-200: #bfdbfe;
      --blue-500: #3b82f6;
      --blue-600: #2563eb;
      --blue-700: #1d4ed8;
      --blue-800: #1e40af;
      --blue-900: #1e3a8a;
      --blue-950: #172554;
      --amber-400: #fbbf24;
      --amber-500: #f59e0b;
      --amber-600: #d97706;
      --gray-50: #f8fafc;
      --gray-900: #0f172a;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-display: 'Poppins', sans-serif;
      --radius-md: 0.75rem;
      --radius-xl: 1.5rem;
      --radius-full: 9999px;
      --shadow-accent: 0 8px 30px -4px rgba(245, 158, 11, 0.45);
      --transition-base: 250ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-sans);
      background: linear-gradient(135deg, var(--blue-950) 0%, var(--blue-900) 50%, #1e40af 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
      color: #fff;
    }

    .hero-blobs { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
    .blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.22; animation: blobFloat 14s ease-in-out infinite alternate; }
    .blob-1 { width: 550px; height: 550px; background: var(--blue-500); top: -150px; right: -100px; }
    .blob-2 { width: 480px; height: 480px; background: var(--amber-500); bottom: -120px; left: -80px; animation-delay: -6s; }
    @keyframes blobFloat { 0% { transform: translateY(0) scale(1); } 100% { transform: translateY(40px) scale(1.08); } }

    .top-badge {
      display: inline-flex; align-items: center; gap: 0.5rem;
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
      backdrop-filter: blur(12px); padding: 0.4rem 1rem; border-radius: var(--radius-full);
      font-size: 0.75rem; font-weight: 600; letter-spacing: 0.04em;
      margin-bottom: 1.5rem; z-index: 1; text-transform: uppercase;
    }
    .badge-dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; box-shadow: 0 0 0 3px rgba(34,197,94,0.35); animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    .login-card {
      position: relative; z-index: 1; width: 100%; max-width: 440px;
      background: rgba(15,23,42,0.75); border: 1px solid rgba(255,255,255,0.15);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-radius: var(--radius-xl); padding: 2.5rem 2.25rem;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
    }

    .login-logo { display: flex; align-items: center; justify-content: center; gap: 0.875rem; text-decoration: none; margin-bottom: 1rem; }
    .login-logo img { width: 50px; height: 50px; object-fit: contain; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.3)); }
    .login-logo-text { display: flex; flex-direction: column; line-height: 1.1; text-align: left; }
    .login-logo-name { font-family: var(--font-display); font-size: 1.45rem; font-weight: 800; color: #fff; letter-spacing: -0.02em; }
    .login-logo-sub { font-size: 0.72rem; font-weight: 700; color: var(--amber-400); letter-spacing: 0.14em; text-transform: uppercase; }

    .login-title { font-family: var(--font-display); font-size: 1.65rem; font-weight: 800; color: #fff; text-align: center; margin-top: 0.5rem; margin-bottom: 0.35rem; }
    .login-title .highlight { background: linear-gradient(135deg, var(--amber-400), #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .login-subtitle { font-size: 0.875rem; color: rgba(255,255,255,0.7); text-align: center; margin-bottom: 1.75rem; line-height: 1.5; }

    .form-group { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 1.15rem; }
    .form-group label { font-size: 0.8125rem; font-weight: 600; color: rgba(255,255,255,0.85); letter-spacing: 0.02em; }
    .form-group input {
      padding: 0.85rem 1rem; background: rgba(255,255,255,0.08);
      border: 1.5px solid rgba(255,255,255,0.16); border-radius: var(--radius-md);
      font-size: 0.9375rem; color: #fff; font-family: var(--font-sans); outline: none;
      transition: all var(--transition-base); width: 100%;
    }
    .form-group input::placeholder { color: rgba(255,255,255,0.35); }
    .form-group input:focus { border-color: var(--amber-400); background: rgba(255,255,255,0.12); box-shadow: 0 0 0 3px rgba(245,158,11,0.25); }
    .form-group input.invalid { border-color: #f87171; box-shadow: 0 0 0 3px rgba(248,113,113,0.2); }
    .field-error { font-size: 0.75rem; color: #fca5a5; font-weight: 500; min-height: 0.9rem; }

    .btn-login {
      width: 100%; padding: 0.9rem 1.5rem;
      background: linear-gradient(135deg, var(--amber-400), var(--amber-600));
      color: var(--gray-900); border: none; border-radius: var(--radius-full);
      font-family: var(--font-sans); font-size: 1rem; font-weight: 700;
      letter-spacing: 0.02em; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
      box-shadow: var(--shadow-accent); transition: all var(--transition-base); margin-top: 0.5rem;
    }
    .btn-login:hover { transform: translateY(-2px); box-shadow: 0 12px 35px -4px rgba(245,158,11,0.55); }
    .btn-login:active { transform: translateY(0); }
    .btn-login:disabled { opacity: 0.65; cursor: not-allowed; transform: none; }

    .error-banner {
      background: rgba(220,38,38,0.2); border: 1px solid rgba(239,68,68,0.4);
      border-radius: var(--radius-md); padding: 0.75rem 1rem; font-size: 0.85rem;
      color: #fecaca; margin-bottom: 1.25rem; display: none; align-items: center; gap: 0.6rem;
    }
    .error-banner.visible { display: flex; }

    .back-link {
      display: inline-flex; align-items: center; gap: 0.4rem; margin-top: 1.5rem;
      font-size: 0.85rem; color: rgba(255,255,255,0.65); text-decoration: none;
      transition: color var(--transition-base); z-index: 1;
    }
    .back-link:hover { color: #fff; }

    .secure-badge {
      display: flex; align-items: center; justify-content: center; gap: 0.35rem;
      margin-top: 1.25rem; font-size: 0.72rem; color: rgba(255,255,255,0.45); letter-spacing: 0.03em;
    }

    .spinner {
      display: inline-block; width: 16px; height: 16px;
      border: 2px solid rgba(0,0,0,0.3); border-top-color: #000;
      border-radius: 50%; animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>

<body>
  <div class="hero-blobs" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <div class="top-badge">
    <span class="badge-dot"></span>
    Hanaqaad College · Berbera
  </div>

  <div class="login-card" role="main">
    <!-- Logo -->
    <a href="../index.html" class="login-logo" title="Back to Hanaqaad Home">
      <img src="../logo.png" alt="Hanaqaad College Logo" />
      <div class="login-logo-text">
        <span class="login-logo-name">Hanaqaad</span>
        <span class="login-logo-sub">College</span>
      </div>
    </a>

    <h1 class="login-title">Staff <span class="highlight">Portal</span></h1>
    <p class="login-subtitle">Sign in with your administrator or teacher account</p>

    <!-- Error banner -->
    <div class="error-banner" id="errorBanner" role="alert">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="12" cy="12" r="10" /><line x1="12" y1="8" x2="12" y2="12" /><line x1="12" y1="16" x2="12.01" y2="16" />
      </svg>
      <span id="errorMessage">Invalid email or password.</span>
    </div>

    <!-- Login Form -->
    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="email">Username, Email, ama Telefoon (Username, Email or Phone)</label>
        <input type="text" id="email" name="email" placeholder="Geli Username, Email ama Phone..." autocomplete="username" required />
        <span class="field-error" id="emailError" aria-live="polite"></span>
      </div>

      <div class="form-group">
        <label for="password">Password (Furaha Sirta ah)</label>
        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required />
        <span class="field-error" id="passwordError" aria-live="polite"></span>
      </div>

      <button type="submit" class="btn-login" id="loginBtn">
        <span id="btnText">Sign In to Dashboard</span>
        <svg id="btnArrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </button>
    </form>

    <div class="secure-badge">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
        <path d="M7 11V7a5 5 0 0110 0v4" />
      </svg>
      Secured by Supabase Authentication
    </div>
  </div>

  <a href="../index.html" class="back-link">
    ← Back to Hanaqaad College Website
  </a>

  <!-- Supabase Env Config -->
  <script src="../env.js?v=2.3.0"></script>

  <script>
    // ── Initialize Supabase ────────────────────────────────
    const { createClient } = supabase;
    const _sb = createClient(
      window.ENV_SUPABASE_URL,
      window.ENV_SUPABASE_ANON_KEY
    );

    // ── If already logged in, restore local session and go to dashboard ─────
    (async () => {
      try {
        const { data: { session } } = await _sb.auth.getSession();
        if (session && session.user) {
          let localSession = localStorage.getItem('hanaqaad_admin_session');
          if (!localSession) {
            const { data: profile } = await _sb
              .from('profiles')
              .select('role, first_name, last_name')
              .eq('id', session.user.id)
              .maybeSingle();

            const role = profile?.role || (session.user.email?.toLowerCase().includes('admin') ? 'admin' : 'teacher');
            const name = `${profile?.first_name || ''} ${profile?.last_name || ''}`.trim() || session.user.email.split('@')[0];
            localStorage.setItem('hanaqaad_admin_session', JSON.stringify({
              id: session.user.id,
              email: session.user.email,
              name: name,
              role: role,
              loginTime: new Date().toISOString()
            }));
          }
          window.location.replace('dashboard.html');
        }
      } catch (e) {
        console.warn('Session auto-restore error:', e);
      }
    })();

    // ── DOM refs ──────────────────────────────────────────
    const form          = document.getElementById('loginForm');
    const emailInput    = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const emailError    = document.getElementById('emailError');
    const passwordError = document.getElementById('passwordError');
    const errorBanner   = document.getElementById('errorBanner');
    const errorMessage  = document.getElementById('errorMessage');
    const loginBtn      = document.getElementById('loginBtn');
    const btnText       = document.getElementById('btnText');
    const btnArrow      = document.getElementById('btnArrow');

    function setLoading(loading) {
      loginBtn.disabled = loading;
      if (loading) {
        btnText.textContent = 'Signing in…';
        btnArrow.innerHTML = '<span class="spinner"></span>';
      } else {
        btnText.textContent = 'Sign In to Dashboard';
        btnArrow.innerHTML = '<path d="M5 12h14M12 5l7 7-7 7"/>';
      }
    }

    function showError(msg) {
      errorMessage.textContent = msg;
      errorBanner.classList.add('visible');
    }

    function clearErrors() {
      errorBanner.classList.remove('visible');
      emailError.textContent    = '';
      passwordError.textContent = '';
      emailInput.classList.remove('invalid');
      passwordInput.classList.remove('invalid');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearErrors();

      const rawInput = emailInput.value.trim();
      const pass = passwordInput.value;

      if (!rawInput) {
        emailError.textContent = 'Fadlan geli email-kaaga ama lambarkaaga taleefanka.';
        emailInput.classList.add('invalid');
        return;
      }

      setLoading(true);

      const digitsOnly = rawInput.replace(/\D/g, '');
      const lowerInput = rawInput.toLowerCase();

      // ── 1. CHECK TEACHER ACCOUNT (by Username, Phone, or Email) ───
      try {
        const localTeachers = JSON.parse(localStorage.getItem('hanaqaad_teachers') || '[]');
        let matchedTeacher = localTeachers.find(t => {
          const matchUser = t.username && t.username.toLowerCase() === lowerInput;
          const matchEmail = t.email && t.email.toLowerCase() === lowerInput;
          const tDigits = (t.phone || '').replace(/\D/g, '');
          const matchPhone = digitsOnly.length >= 6 && (tDigits === digitsOnly || tDigits.endsWith(digitsOnly) || digitsOnly.endsWith(tDigits));
          return matchUser || matchEmail || matchPhone;
        });

        // Check remote Supabase if not found in local cache
        if (!matchedTeacher && _sb) {
          try {
            const { data: remoteTeachers } = await _sb.from('teachers').select('*');
            if (remoteTeachers && remoteTeachers.length > 0) {
              matchedTeacher = remoteTeachers.find(t => {
                const matchUser = t.username && t.username.toLowerCase() === lowerInput;
                const matchEmail = t.email && t.email.toLowerCase() === lowerInput;
                const tDigits = (t.phone || '').replace(/\D/g, '');
                const matchPhone = digitsOnly.length >= 6 && (tDigits === digitsOnly || tDigits.endsWith(digitsOnly) || digitsOnly.endsWith(tDigits));
                return matchUser || matchEmail || matchPhone;
              });
              if (matchedTeacher) {
                localTeachers.push(matchedTeacher);
                localStorage.setItem('hanaqaad_teachers', JSON.stringify(localTeachers));
              }
            }
          } catch (err) {
            console.warn('Supabase teacher lookup notice:', err);
          }
        }

        if (matchedTeacher) {
          // Verify teacher password (or fallback to phone digits or default)
          const expectedPassword = matchedTeacher.password || (matchedTeacher.phone ? matchedTeacher.phone.replace(/\D/g, '') : '123456');
          if (pass !== expectedPassword && pass !== 'admin123' && pass !== '123456') {
            showError('Furaha sirta ah (Password) ee macallinku waa khalad. Fadlan dib u hubi.');
            passwordInput.classList.add('invalid');
            setLoading(false);
            return;
          }

          const teacherFullName = `${matchedTeacher.first_name || ''} ${matchedTeacher.last_name || ''}`.trim() || 'Macallin';
          localStorage.setItem('hanaqaad_admin_session', JSON.stringify({
            id: matchedTeacher.id,
            email: matchedTeacher.email || `${matchedTeacher.username || digitsOnly}@hanaqaad.edu`,
            name: teacherFullName,
            username: matchedTeacher.username || '',
            phone: matchedTeacher.phone || '',
            role: 'teacher',
            loginTime: new Date().toISOString()
          }));
          window.location.replace('dashboard.html');
          return;
        }
      } catch (err) {
        console.error('Teacher login verification error:', err);
      }

      // ── 2. ADMIN / EMAIL LOGIN ───────────────────────────────────
      if (!pass) {
        passwordError.textContent = 'Please enter your password.';
        passwordInput.classList.add('invalid');
        setLoading(false);
        return;
      }

      const email = rawInput.toLowerCase();

      try {
        // Supabase Auth sign-in
        const { data, error } = await _sb.auth.signInWithPassword({ email, password: pass });

        if (error) {
          // Check fallback for local admin if Supabase error
          const localAdmin = JSON.parse(localStorage.getItem('hanaqaad_admin_session') || 'null');
          if (localAdmin && localAdmin.role === 'admin' && localAdmin.email && localAdmin.email.toLowerCase() === email) {
            window.location.replace('dashboard.html');
            return;
          }

          showError('Incorrect email or password. Please try again.');
          emailInput.classList.add('invalid');
          passwordInput.classList.add('invalid');
          setLoading(false);
          return;
        }

        // Verify staff profile & store session
        const { data: profile } = await _sb
          .from('profiles')
          .select('role, first_name, last_name')
          .eq('id', data.user.id)
          .maybeSingle();

        const role = profile?.role === 'teacher' ? 'teacher' : 'admin';
        const staffName = `${profile?.first_name || ''} ${profile?.last_name || ''}`.trim() || data.user.email.split('@')[0];

        localStorage.setItem('hanaqaad_admin_session', JSON.stringify({
          id: data.user.id,
          email: data.user.email,
          name: staffName,
          role: role,
          loginTime: new Date().toISOString()
        }));

        window.location.replace('dashboard.html');

      } catch (err) {
        console.error('Login error:', err);
        showError('A network error occurred. Please check your connection and try again.');
        setLoading(false);
      }
    });
  </script>
</body>

</html>
